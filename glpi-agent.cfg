# GLPI Agent — Configuração padrão Grupo Inbetta
# Caminho no Windows: C:\ProgramData\GLPI-Agent\agent.cfg
# Após editar, reinicie o serviço: Restart-Service GLPI-Agent

# ── Servidor ─────────────────────────────────────────────────────────────────
# URL completa do GLPI. Sem barra no final.
server = http://192.168.1.10/glpi

# ── Frequência de envio ───────────────────────────────────────────────────────
# Tempo em segundos entre envios de inventário.
# 86400 = 24h. Não reduza abaixo de 3600 (1h) sem necessidade.
delaytime = 86400

# ── Tag de identificação ─────────────────────────────────────────────────────
# Aparece no GLPI como campo "Etiqueta". Útil para agrupar por empresa/unidade.
tag = Inbetta

# ── HTTP local do agente ─────────────────────────────────────────────────────
# O agente expõe uma porta HTTP local para status e disparo manual.
# 0 = desabilitado (recomendado para estações comuns)
# 62354 = porta padrão (habilitar se precisar de trigger remoto via GLPI)
no-httpd = 1

# ── Log ──────────────────────────────────────────────────────────────────────
logger  = file
logfile = C:\ProgramData\GLPI-Agent\glpi-agent.log
# debug = 0 — mude para 1 temporariamente se precisar investigar problemas

# ── Módulos ativos ───────────────────────────────────────────────────────────
# inventory   : coleta hardware/software (sempre ativo)
# netdiscovery: varredura de rede para detectar dispositivos sem agente
# netinventory: coleta SNMP de switches/impressoras/etc
# deploy      : permite instalar software remotamente via GLPI
# Comente as linhas abaixo para desativar módulos não utilizados
tasks = inventory
